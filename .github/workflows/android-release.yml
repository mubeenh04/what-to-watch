# Ships the Android app (phone and Google TV) without the Play Store.
#
# On every push to main that changes the app, this works out the app's runtime version (a
# fingerprint of everything native: dependencies, plugins, app.json) and then:
#   - if a GitHub release already has an APK with that runtime version, it publishes an
#     over-the-air update with EAS Update. Installed apps pick it up the next time they open.
#   - otherwise native code changed, so installed apps can't take an over-the-air update. It
#     builds a new signed APK on this runner (eas build --local, free, signed with the keystore
#     EAS keeps for the project) and publishes it as a GitHub release, which Obtainium offers
#     as an update on the phone and the TV.
#
# Setup (once): repository secret EXPO_TOKEN and repository variable EAS_PROJECT_ID.
# See mobile/APP_UPDATES.md.
name: Android app release

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '!mobile/**/*.md'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
    inputs:
      force_apk:
        description: Build and release a new APK even if an over-the-air update would do
        type: boolean
        default: false

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
  # Public values (the same ones as in eas.json); the update bundle needs them too.
  EXPO_PUBLIC_SUPABASE_URL: https://ezedrdpzhgtwrfjmupvf.supabase.co
  EXPO_PUBLIC_SUPABASE_KEY: sb_publishable_kIQZibn3PokFjSBaLXgndQ_AusxrXGz
  EAS_CLI: eas-cli@18
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check setup
        id: setup
        working-directory: .
        run: |
          if [ -z "$EXPO_TOKEN" ] || [ -z "$EAS_PROJECT_ID" ]; then
            echo "::warning::Skipping: add the EXPO_TOKEN secret and the EAS_PROJECT_ID variable first (mobile/APP_UPDATES.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.setup.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.setup.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        if: steps.setup.outputs.ready == 'true'
        run: npm ci

      - name: Work out the runtime version and what to ship
        id: plan
        if: steps.setup.outputs.ready == 'true'
        env:
          FORCE_APK: ${{ inputs.force_apk || false }}
        run: |
          RUNTIME=$(npx expo-updates runtimeversion:resolve --platform android \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).runtimeVersion))')
          echo "Runtime version: $RUNTIME"
          TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.draft == false) | select((.body // \"\") | contains(\"runtime-version: $RUNTIME\")) | .tag_name" \
            | head -n 1)
          echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ] && [ "$FORCE_APK" != "true" ]; then
            echo "Release $TAG already has this runtime version: publishing an over-the-air update."
            echo "kind=update" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
            echo "No release has this runtime version: building APK $VERSION."
            echo "kind=apk" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            # Above the versionCode of the APKs built by hand before this workflow existed.
            echo "version_code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          fi

      # ---- Over-the-air update ----------------------------------------------------------------

      - name: Publish over-the-air update
        if: steps.plan.outputs.kind == 'update'
        env:
          APP_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          MESSAGE=$(git log -1 --pretty=%s)
          npx "$EAS_CLI" update --channel production --environment production --platform android \
            --message "$MESSAGE" --non-interactive

      # ---- New APK + GitHub release -----------------------------------------------------------

      - uses: actions/setup-java@v4
        if: steps.plan.outputs.kind == 'apk'
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        if: steps.plan.outputs.kind == 'apk'

      - name: Build signed APK
        if: steps.plan.outputs.kind == 'apk'
        env:
          APP_VERSION: ${{ steps.plan.outputs.version }}
          APP_VERSION_CODE: ${{ steps.plan.outputs.version_code }}
        run: |
          npx "$EAS_CLI" build --local --platform android --profile production --non-interactive \
            --output "$RUNNER_TEMP/what-to-watch-$APP_VERSION.apk"

      - name: Publish GitHub release
        if: steps.plan.outputs.kind == 'apk'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          RUNTIME: ${{ steps.plan.outputs.runtime }}
        run: |
          SUBJECT=$(git log -1 --pretty=%s)
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          What to Watch $VERSION for Android phones and Google TV.

          Latest change: $SUBJECT

          Install or update with Obtainium, or download the APK below. Smaller changes after this
          arrive by themselves when the app opens, with no new APK.

          <!-- runtime-version: $RUNTIME -->
          NOTES
          gh release create "v$VERSION" "$RUNNER_TEMP/what-to-watch-$VERSION.apk" \
            --target "$GITHUB_SHA" --title "What to Watch $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
